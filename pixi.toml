[workspace]
name = "ems-germany-analysis"
version = "0.1.0"
description = "CLI program that runs the analysis and generates a report for emergency medical service access in Germany"
channels = ["conda-forge", "https://prefix.dev/thath"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.13"
click = ">=8.3.1"
rich = ">=14.3.3"
psycopg = ">=3.3.0"
psycopg-pool = ">=3.3.0"
httpx = ">=0.27"
plotly = ">=6.6.0"
numpy = ">=2.0"
pandas = ">=3.0.1"
platformdirs = ">=4.9.4"
scipy = ">=1.17.1"
postgresql = ">=18.3,<19"
postgis = ">=3.6.2,<4"
quarto = ">=1.8.27,<2"
jupyter = ">=1.1.1,<2"

[pypi-dependencies]
ems-germany-analysis = { path = ".", editable = true }

[feature.dev.dependencies]
commitizen = ">=4.3.0"
coverage = ">=7.6.10"
ipykernel = ">=6.29.4"
ipython = ">=8.18.0"
ipywidgets = ">=8.1.2"
mypy = ">=1.14.1"
pytest = ">=8.3.4"
pytest-mock = ">=3.14.0"
pytest-xdist = ">=3.6.1"
ruff = ">=0.9.2"
pytest-asyncio = ">=1.3.0"
pytest-sugar = ">=1.1.1"
prek = ">=0.3.5"
pg-helper = ">=0.1.0"
flask = ">=3.1.3,<4"

[environments]
dev = ["dev"]

[tasks]
emsde = "emsde"
